name: Test SZSE Access

on:
  workflow_dispatch:

jobs:
  test-szse:
    runs-on: ubuntu-latest

    steps:
      - name: Show runner IP
        run: |
          echo "Runner IP:"
          curl -s https://api.ipify.org
          echo

      - name: Test SZSE ETF page
        continue-on-error: true
        run: |
          curl \
            --location \
            --connect-timeout 15 \
            --max-time 30 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36" \
            --referer "https://www.szse.cn/" \
            --write-out "\nHTTP=%{http_code}\nSIZE=%{size_download}\nTIME=%{time_total}s\n" \
            --output /tmp/szse-page.html \
            "https://www.szse.cn/market/fund/volume/etf/index.html"

      - name: Test SZSE XLSX
        continue-on-error: true
        run: |
          curl \
            --location \
            --connect-timeout 15 \
            --max-time 60 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36" \
            --referer "https://www.szse.cn/market/fund/volume/etf/index.html" \
            --write-out "\nHTTP=%{http_code}\nSIZE=%{size_download}\nCONTENT_TYPE=%{content_type}\nTIME=%{time_total}s\n" \
            --output /tmp/szse-etf.xlsx \
            "https://www.szse.cn/api/report/ShowReport?SHOWTYPE=xlsx&CATALOGID=scsj_fund_jjgm&TABKEY=tab1&txtStart=2026-11-03&txtEnd=2026-11-03&jjlb=ETF"

          echo
          echo "Downloaded file:"
          ls -lh /tmp/szse-etf.xlsx 2>/dev/null || true

          file /tmp/szse-etf.xlsx 2>/dev/null || true

      - name: Validate XLSX
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import zipfile

          path = "/tmp/szse-etf.xlsx"

          if not os.path.exists(path):
              print("RESULT: NO FILE")
              raise SystemExit(1)

          size = os.path.getsize(path)
          print(f"File size: {size}")

          if not zipfile.is_zipfile(path):
              print("RESULT: NOT A VALID XLSX")
              raise SystemExit(1)

          with zipfile.ZipFile(path) as z:
              if "[Content_Types].xml" not in z.namelist():
                  print("RESULT: INVALID XLSX STRUCTURE")
                  raise SystemExit(1)

          print("RESULT: SZSE XLSX SUCCESS")
          PY
